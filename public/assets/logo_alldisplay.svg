<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <defs>
    <linearGradient id="adBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="jewelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ea580c" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Left Icon Emblem -->
  <g filter="url(#badgeShadow)">
    <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#adBadgeGrad)"/>
    <rect x="4.5" y="4.5" width="55" height="55" rx="13.5" stroke="#ffedd5" stroke-opacity="0.3" stroke-width="1"/>
  </g>

  <!-- Stylized Jewel / Diamond Accent at Top of Badge -->
  <path d="M32 9 L34.5 13 L32 17 L29.5 13 Z" fill="url(#jewelGrad)"/>
  <circle cx="32" cy="13" r="1" fill="#ea580c"/>

  <!-- AD Monogram inside Emblem -->
  <!-- Letter A -->
  <path d="M22 47 L29.5 21 L34.5 21 L42 47 L36.8 47 L35.2 41.5 L28.8 41.5 L27.2 47 Z M30.1 37.2 L33.9 37.2 L32 28.5 Z" fill="#ffffff" stroke="#ffffff" stroke-width="0.3"/>
  <!-- Elegant D curve interlaced with A -->
  <path d="M30 21 L38 21 C43.5 21 47 25 47 31 C47 37 43.5 41 38 41 L34 41" fill="none" stroke="#fed7aa" stroke-width="3" stroke-linecap="round"/>

  <!-- Brand Typography -->
  <!-- "ALL DISPLAY" Primary Wordmark -->
  <text x="72" y="29" font-family="'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="19" fill="#0f172a" letter-spacing="0.04em">ALL DISPLAY</text>

  <!-- Tagline -->
  <text x="72" y="44" font-family="'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="8.5" fill="#ea580c" letter-spacing="0.14em">JEWELLERY DISPLAYS &amp; PACKAGING</text>

  <!-- Location & Manufacturer Credential -->
  <text x="72" y="55" font-family="'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="6.8" fill="#64748b" letter-spacing="0.08em">DIRECT MANUFACTURER • SOWCARPET, CHENNAI</text>
</svg>
